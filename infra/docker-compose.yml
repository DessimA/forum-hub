services:
  mysql:
    image: mysql:8.4
    container_name: forumhub-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: forum_hub_dev
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - forumhub-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: infra/backend/Dockerfile
    container_name: forumhub-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/forum_hub_dev
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - API_SECURITY_TOKEN_SECRET=dev-secret-123456-seguro-2025
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - forumhub-network

  frontend:
    build:
      context: ..
      dockerfile: infra/frontend/Dockerfile
    container_name: forumhub-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - forumhub-network

networks:
  forumhub-network:
    driver: bridge

volumes:
  mysql_data:
