services:
  mysql:
    image: mysql:8.4
    container_name: forumhub-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - forumhub-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: forumhub-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - forumhub-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: infra/backend/Dockerfile
    container_name: forumhub-backend
    restart: always
    profiles: ["prod", "full", "dev"]
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - API_SECURITY_TOKEN_SECRET=${API_SECURITY_TOKEN_SECRET}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - forumhub-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

  frontend:
    build:
      context: ..
      dockerfile: infra/frontend/Dockerfile
    container_name: forumhub-frontend
    restart: always
    profiles: ["prod", "full", "dev"]
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - forumhub-network

networks:
  forumhub-network:
    driver: bridge

volumes:
  mysql_data:
