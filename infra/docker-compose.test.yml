services:
  backend-test:
    build:
      context: ..
      dockerfile: infra/backend/Dockerfile
      target: build
    container_name: forumhub-backend-test
    environment:
      - SPRING_PROFILES_ACTIVE=test
      - SPRING_JPA_HIBERNATE_DDL_AUTO=none
      - SPRING_DATA_REDIS_HOST=redis
    networks:
      - forumhub-network

  frontend-test:
    build:
      context: ..
      dockerfile: infra/frontend/Dockerfile
      target: build
    container_name: forumhub-frontend-test
    networks:
      - forumhub-network

  cypress:
    image: cypress/included:13.17.0
    container_name: forumhub-cypress
    depends_on:
      frontend:
        condition: service_healthy
    environment:
      - CYPRESS_baseUrl=${CYPRESS_BASE_URL:-http://frontend:80}
      - CYPRESS_API_URL=http://backend:8080
    volumes:
      - ../frontend/cypress:/app/cypress
      - ../frontend/cypress.config.cjs:/app/cypress.config.js
    working_dir: /app
    networks:
      - forumhub-network
