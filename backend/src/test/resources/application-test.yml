spring:
  datasource:
    url: jdbc:h2:mem:forumhub
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    clean-on-validation-error: true
    clean-disabled: false
  sql:
    init:
      mode: never