logging:
  level:
    root: ERROR
    com.forumhub: WARN
    org.springframework: ERROR
    org.hibernate: ERROR

spring:
  cache:
    type: redis
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  datasource:
    url: jdbc:h2:mem:forumhub_test;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration

api:
  security:
    token:
      secret: ${API_SECURITY_TOKEN_SECRET:test-secret-12345678}
    ratelimit:
      max-requests: 1000 # Limite alto para não afetar outros testes