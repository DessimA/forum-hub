spring:
  main:
    banner-mode: "off"
  datasource:
    url: jdbc:h2:mem:forumhub;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    repair-on-migrate: true

logging:
  level:
    root: WARN
    com.forumhub: WARN
    org.springframework: WARN
    org.flywaydb: ERROR
